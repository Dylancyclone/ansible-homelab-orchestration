---
- name: Start Pelican Wings
  when: pelican_wings_enabled
  block:
    - name: Check for Pelican Wings Breaking Changes
      ansible.builtin.include_role:
        name: breaking_changes
      vars:
        breaking_changes_application: pelican_wings

    - name: Create Pelican Wings Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ pelican_wings_config_directory }}"
        - "{{ pelican_wings_logs_directory }}"
        - "{{ pelican_wings_tmp_directory }}"
        - "{{ pelican_wings_data_directory }}"
        - "{{ pelican_wings_data_directory }}/volumes"

    - name: Create Pelican Wings Docker Network
      community.docker.docker_network:
        name: "{{ pelican_wings_network_name }}"
        driver: bridge
        ipam_config:
          - subnet: "{{ pelican_wings_network_subnet }}"
        driver_options:
          com.docker.network.bridge.name: "{{ pelican_wings_network_name }}"

    # Wings refuses to start without a config.yml, and that file is GENERATED BY THE PANEL when you
    # create a node (Admin -> Nodes -> Create -> Configuration tab). Deploying the container before
    # the file exists would leave it in a restart crash-loop, so gate the container on the config
    # being present and print the one-time setup instructions until then.
    - name: Check for Pelican Wings config
      ansible.builtin.stat:
        path: "{{ pelican_wings_config_directory }}/config.yml"
      register: pelican_wings_config

    - name: Report missing Pelican Wings config
      ansible.builtin.debug:
        msg: >-
          Pelican Wings is enabled but no config.yml was found at
          {{ pelican_wings_config_directory }}/config.yml. Create a node in the Panel UI
          (Admin -> Nodes -> Create), open its Configuration tab, save the generated YAML to that
          path on this host, then re-run this role. Wings will not be started until it exists.
      when: not pelican_wings_config.stat.exists

    - name: Pelican Wings Docker Container
      when: pelican_wings_config.stat.exists
      community.docker.docker_container:
        name: "{{ pelican_wings_container_name }}"
        image: "{{ pelican_wings_image_name }}:{{ pelican_wings_image_version }}"
        pull: true
        # Docker-out-of-Docker: Wings talks to the host Docker socket to spawn sibling game-server
        # containers. Mounting docker.sock is effectively root on the host, and this is inherent to
        # the architecture (a host-installed Wings mounts it too). The fixed
        # /var/lib/docker/containers and /etc/ssl/certs mounts are host paths Wings needs in order to
        # read container logs and validate TLS.
        #
        # IMPORTANT, identical host:container paths for `data`, `tmp` and `config`: when Wings spawns
        # a game server (or the one-shot installer) it hands the HOST Docker daemon bind-mount source
        # paths *as Wings sees them inside this container*, so each of those paths must also be valid
        # on the host. Wings re-exports THREE things into every game container: the game-data volume
        # dir, the install-script tmp dir, AND files it generates in its config dir (the passwd and
        # group files for the container user, plus machine-id). All three are therefore mounted at
        # the SAME path inside and out, and config.yml must point at those host paths:
        # system.data / system.tmp_directory / system.user.passwd.directory /
        # system.machine_id.directory. Get any of them wrong and the game server fails with
        # "bind source path does not exist" (either the install hangs or the container fails to
        # boot). Because the config dir is no longer at the image's baked-in /etc/pelican, the
        # container command is overridden to point --config at the real path. The log dir stays
        # canonical: per-server logs are written into each server's own data dir, so it is never
        # re-exported.
        command: "/usr/bin/wings --config {{ pelican_wings_config_directory }}/config.yml"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "/var/lib/docker/containers/:/var/lib/docker/containers/"
          - "{{ pelican_wings_config_directory }}:{{ pelican_wings_config_directory }}"
          - "{{ pelican_wings_data_directory }}:{{ pelican_wings_data_directory }}"
          - "{{ pelican_wings_logs_directory }}:/var/log/pelican/"
          - "{{ pelican_wings_tmp_directory }}:{{ pelican_wings_tmp_directory }}"
          - "/etc/ssl/certs:/etc/ssl/certs:ro"
        env:
          TZ: "{{ computer_timezone }}"
          WINGS_UID: "{{ pelican_wings_user_id | string }}"
          WINGS_GID: "{{ pelican_wings_group_id | string }}"
          WINGS_USERNAME: "{{ pelican_wings_username }}"
        networks:
          - name: "{{ pelican_wings_network_name }}"
        ports:
          - "{{ pelican_wings_port }}:8080"
          - "{{ pelican_wings_sftp_port }}:2022"
        tty: true
        restart_policy: unless-stopped
        memory: "{{ pelican_wings_memory }}"
        labels:
          # Pinned image, so opt out of Watchtower auto-updates. Upgrade Wings and the Panel
          # together deliberately (bump pelican_wings_image_version).
          com.centurylinklabs.watchtower.enable: "false"
          traefik.enable: "{{ (pelican_wings_dns_accessible or pelican_wings_available_externally) | string }}"
          traefik.http.services.pelican_wings.loadbalancer.server.port: "8080"
          traefik.http.routers.pelican_wings.rule: "Host(`{{ pelican_wings_hostname ~ '.' if pelican_wings_hostname else '' }}{{ dns_domain }}`)"
          traefik.http.routers.pelican_wings.tls.domains[0].main: "{{ dns_domain }}"
          traefik.http.routers.pelican_wings.tls.domains[0].sans: "*.{{ dns_domain }}"
          traefik.http.routers.pelican_wings.tls.certresolver: "letsencrypt"
          traefik.http.routers.pelican_wings.middlewares: "{{ omit if pelican_wings_available_externally else 'blockExternal@file' }}"

- name: Stop Pelican Wings
  when: not pelican_wings_enabled
  block:
    - name: Stop Pelican Wings
      community.docker.docker_container:
        name: "{{ pelican_wings_container_name }}"
        state: absent

    # Docker only removes a network once nothing is attached to it, and stopping Wings does not stop
    # the game-server containers it spawned onto this network. Tolerate the failure so that
    # disabling Wings is not blocked by servers that are still running: re-run the role once they
    # are stopped and the network goes away.
    - name: Remove Pelican Wings Docker Network
      community.docker.docker_network:
        name: "{{ pelican_wings_network_name }}"
        state: absent
      failed_when: false
