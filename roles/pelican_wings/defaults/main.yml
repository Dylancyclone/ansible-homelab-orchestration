---
pelican_wings_enabled: false
pelican_wings_dns_accessible: "{{ traefik_enable_dns_for_all }}"
pelican_wings_available_externally: false

# directories
# Wings' own config (config.yml, which is GENERATED BY THE PANEL - see the documentation), logs and
# tmp are small, so they live on the docker pool.
pelican_wings_config_directory: "{{ docker_home }}/pelican_wings/etc"
pelican_wings_logs_directory: "{{ docker_home }}/pelican_wings/log"
pelican_wings_tmp_directory: "{{ docker_home }}/pelican_wings/tmp"
# Per-server game data (worlds, saves - potentially large) lives on the data pool instead. Wings
# writes each server under [this]/volumes/[server-uuid]/, so the folders are named by UUID rather
# than by game: identify servers in the Panel UI, not by browsing this directory.
pelican_wings_data_directory: "{{ data_home }}/pelican"

# Runtime user Wings runs as inside the container (matches the upstream compose defaults).
pelican_wings_user_id: 988
pelican_wings_group_id: 988
pelican_wings_username: pelican

# network
pelican_wings_hostname: wings
# Wings API plus the browser console websocket. Traefik terminates TLS in front of this, so the
# Panel node must be created with "HTTPS with (reverse) proxy" and port 443 (see the documentation).
# Also published on the host at this port for direct or debug access.
pelican_wings_port: 8104
# In-panel SFTP file management. This is raw TCP and cannot be proxied through Traefik, so it is
# published directly on the host: connect to sftp://[your_server_ip]:[this].
pelican_wings_sftp_port: 2022

# Dedicated bridge network Wings attaches the game-server containers it spawns to (mirrors the
# upstream wings compose, which uses a named bridge on its own subnet). Docker's automatic subnet
# assignment climbs from 172.18 up and the upstream default sits in that range, so this is pinned to
# the top of the 172.16/12 pool to avoid colliding with a network Docker assigns later.
pelican_wings_network_name: wings0
pelican_wings_network_subnet: 172.31.0.0/16

# containers
pelican_wings_container_name: pelican_wings
pelican_wings_image_name: ghcr.io/pelican-dev/wings
# Pinned and excluded from Watchtower (see tasks). Wings and the Panel share a compatibility
# contract, so upgrade them together deliberately. Bump this and re-run the role to upgrade.
pelican_wings_image_version: v1.0.0-beta26

pelican_wings_container_names: # Used to check if app is running
  - "{{ pelican_wings_container_name }}"

# specs
# Wings itself is lightweight. Each game server it spawns is a separate container whose memory limit
# is set per-server in the Panel, not here.
pelican_wings_memory: 512m
